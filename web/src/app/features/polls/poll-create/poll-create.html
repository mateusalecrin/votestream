<div class="flex min-h-screen w-full flex-col items-center px-4 py-12 sm:py-16">
  <div class="w-full max-w-xl">
    <header class="mb-8 flex flex-col items-center text-center">
      <span class="mb-3 text-4xl">🗳️</span>
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">Criar enquete</h1>
      <p class="mt-2 text-sm text-slate-500">Defina o título, a pergunta e as opções de voto.</p>
    </header>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="flex flex-col gap-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
    >
      <div>
        <label for="title" class="mb-1 block text-sm font-medium text-slate-700">Título</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          placeholder="Ex: Linguagem preferida"
          class="w-full rounded-lg border px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          [class.border-red-400]="form.controls.title.invalid && form.controls.title.touched"
          [class.border-slate-300]="!(form.controls.title.invalid && form.controls.title.touched)"
        />
      </div>

      <div>
        <label for="question" class="mb-1 block text-sm font-medium text-slate-700">Pergunta</label>
        <input
          id="question"
          type="text"
          formControlName="question"
          placeholder="Ex: Qual linguagem você mais gosta de usar?"
          class="w-full rounded-lg border px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          [class.border-red-400]="form.controls.question.invalid && form.controls.question.touched"
          [class.border-slate-300]="!(form.controls.question.invalid && form.controls.question.touched)"
        />
      </div>

      <div formArrayName="options">
        <label class="mb-1 block text-sm font-medium text-slate-700">Opções</label>
        <div class="flex flex-col gap-2">
          @for (option of options.controls; track $index) {
            <div class="flex items-center gap-2">
              <input
                type="text"
                [formControlName]="$index"
                placeholder="Opção {{ $index + 1 }}"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
              @if (options.length > 2) {
                <button
                  type="button"
                  (click)="removeOption($index)"
                  class="shrink-0 rounded-full p-2 text-slate-400 hover:bg-slate-100 hover:text-red-500"
                  aria-label="Remover opção"
                >
                  ✕
                </button>
              }
            </div>
          }
        </div>
        <button type="button" (click)="addOption()" class="mt-2 text-sm font-medium text-indigo-600 hover:text-indigo-700">
          + Adicionar opção
        </button>
      </div>

      @if (error()) {
        <div class="rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <div class="flex items-center justify-end gap-3 pt-2">
        <a routerLink="/polls" class="text-sm font-medium text-slate-500 hover:text-slate-700">Cancelar</a>
        <button
          type="submit"
          [disabled]="submitting()"
          class="rounded-full bg-indigo-600 px-5 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ submitting() ? 'Criando...' : 'Criar enquete' }}
        </button>
      </div>
    </form>
  </div>
</div>
